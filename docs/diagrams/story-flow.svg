<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
  <title id="t">Re:Claim visitor workflow</title>
  <desc id="d">The path a visitor takes: the Christmas shop, the bat, the catch and the Reveal, the haunted shop where every Take plays a consequence in the object, closing time and checkout, Accept with the jump scare and the confession in blood, then back to the Christmas shop with an echo left for the next visitor and a receipt of the dark patterns used.</desc>
  <defs>
    <style>
      .bg { fill: #0e1420; }
      .day { fill: #fbf6ee; stroke: #c8a24c; stroke-width: 1.6; }
      .night { fill: #171a22; stroke: #a8894e; stroke-width: 1.6; }
      .end { fill: #1a0d10; stroke: #9b1b24; stroke-width: 1.8; }
      .h1 { font: 700 26px Georgia, 'Times New Roman', serif; fill: #e6dccb; }
      .sub { font: 400 12.5px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #b9b0a2; }
      .nd { font: 700 14px Georgia, 'Times New Roman', serif; }
      .dk { fill: #2a2220; }
      .lt { fill: #e6dccb; }
      .tx { font: 400 11.5px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .txd { fill: #4a3e38; }
      .txl { fill: #b9b0a2; }
      .num { font: 700 12px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #0e1420; }
      .lb { font: 600 11px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #e0c27a; }
      .icd { fill: none; stroke: #9b1b24; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .icn { fill: none; stroke: #c8a24c; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .ln { fill: none; stroke: #c8a24c; stroke-width: 2; }
      .lnr { fill: none; stroke: #c0392b; stroke-width: 2; }
      .dash { stroke-dasharray: 6 5; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c8a24c" />
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c0392b" />
    </marker>
  </defs>

  <rect class="bg" width="1280" height="800" />
  <text class="h1" x="40" y="46">Re:Claim · what a visitor goes through</text>
  <text class="sub" x="40" y="68">Same layout from start to end: only light, palette, copy and the condition of the objects change. Cream cards are the Christmas shop, dark cards the haunted one.</text>

  <!-- ============ Row 1: day ============ -->
  <!-- 1 -->
  <rect class="day" x="40" y="96" width="260" height="128" rx="12" />
  <circle cx="62" cy="118" r="11" fill="#c8a24c" /><text class="num" x="58" y="122">1</text>
  <g transform="translate(250 106)"><rect class="icd" x="2" y="10" width="26" height="18" rx="2" /><path class="icd" d="M0 10 H30 M15 10 V28 M15 10 C 9 2, 3 6, 8 10 M15 10 C 21 2, 27 6, 22 10" /></g>
  <text class="nd dk" x="82" y="123">The Christmas shop</text>
  <text class="tx txd" x="58" y="150">Search, categories, filters, sort,</text>
  <text class="tx txd" x="58" y="166">24 live 3D products, cart, checkout.</text>
  <text class="tx txd" x="58" y="182">Hidden in it: fake countdown, false</text>
  <text class="tx txd" x="58" y="198">scarcity, a pre-ticked add-on…</text>

  <!-- 2 -->
  <rect class="day" x="350" y="96" width="260" height="128" rx="12" />
  <circle cx="372" cy="118" r="11" fill="#c8a24c" /><text class="num" x="368" y="122">2</text>
  <g transform="translate(556 108)"><path class="icd" d="M17 6 C 14 4, 12 8, 12 10 C 8 6, 3 5, 0 8 C 4 9, 6 12, 6 15 C 9 13, 12 14, 14 17 L17 20 L20 17 C 22 14, 25 13, 28 15 C 28 12, 30 9, 34 8 C 31 5, 26 6, 22 10 C 22 8, 20 4, 17 6 Z" /></g>
  <text class="nd dk" x="392" y="123">A bat gets in</text>
  <text class="tx txd" x="368" y="150">It hangs from the decorations and</text>
  <text class="tx txd" x="368" y="166">flies between perches. Over it the</text>
  <text class="tx txd" x="368" y="182">cursor becomes a reaching hand and</text>
  <text class="tx txd" x="368" y="198">the lights flicker (≤ 3 flashes/s).</text>

  <!-- 3 -->
  <rect class="day" x="660" y="96" width="260" height="128" rx="12" />
  <circle cx="682" cy="118" r="11" fill="#c8a24c" /><text class="num" x="678" y="122">3</text>
  <g transform="translate(872 106)"><path class="icd" d="M9 26 V8 A2.5 2.5 0 0 1 14 8 V16 M14 15 V5 A2.5 2.5 0 0 1 19 5 V15 M19 14 V7 A2.5 2.5 0 0 1 24 7 V16 C 24 22, 22 27, 17 29 H12 C 8 27, 5 23, 4 19 L2 15 A2.2 2.2 0 0 1 6 13 L9 17" /></g>
  <text class="nd dk" x="702" y="123">Catch it</text>
  <text class="tx txd" x="678" y="150">Click, Enter, or two taps. It jerks</text>
  <text class="tx txd" x="678" y="166">round, lunges at the screen and its</text>
  <text class="tx txd" x="678" y="182">wings cover it. Everything goes</text>
  <text class="tx txd" x="678" y="198">dark.</text>

  <!-- 4 -->
  <rect class="night" x="970" y="96" width="270" height="128" rx="12" />
  <circle cx="992" cy="118" r="11" fill="#c8a24c" /><text class="num" x="988" y="122">4</text>
  <g transform="translate(1194 106)"><path class="icn" d="M20 2 A13 13 0 1 0 30 22 A10 10 0 0 1 20 2 Z" /></g>
  <text class="nd lt" x="1012" y="123">The Reveal</text>
  <text class="tx txl" x="988" y="150">In the dark the shop turns: one</text>
  <text class="tx txl" x="988" y="166">shared decay shader burns, rots,</text>
  <text class="tx txl" x="988" y="182">dusts and tears every object in</text>
  <text class="tx txl" x="988" y="198">place. A shop after a fictional war.</text>

  <path class="ln" d="M300 160 H348" marker-end="url(#a)" />
  <path class="ln" d="M610 160 H658" marker-end="url(#a)" />
  <path class="ln" d="M920 160 H968" marker-end="url(#a)" />

  <!-- ============ Row 2: haunted (right to left) ============ -->
  <!-- 5 -->
  <rect class="night" x="970" y="300" width="270" height="128" rx="12" />
  <circle cx="992" cy="322" r="11" fill="#c8a24c" /><text class="num" x="988" y="326">5</text>
  <g transform="translate(1194 308)"><path class="icn" d="M2 28 V14 L15 3 L28 14 V28 Z M11 28 V19 H19 V28" /><path class="icn" d="M8 13 h3 M19 13 h3" /></g>
  <text class="nd lt" x="1012" y="327">The haunted shop</text>
  <text class="tx txl" x="988" y="354">Same grid, cart and menu. Bats in the</text>
  <text class="tx txl" x="988" y="370">dark, brownouts, a crawling hand, a</text>
  <text class="tx txl" x="988" y="386">scarecrow, a werewolf, graves under</text>
  <text class="tx txl" x="988" y="402">the shelves. Every item says who it was.</text>

  <!-- 6 -->
  <rect class="night" x="660" y="300" width="260" height="128" rx="12" />
  <circle cx="682" cy="322" r="11" fill="#c8a24c" /><text class="num" x="678" y="326">6</text>
  <g transform="translate(874 308)"><path class="icn" d="M0 2 H5 L9 19 H25 L28 7 H7" /><circle class="icn" cx="11" cy="25" r="2.4" /><circle class="icn" cx="23" cy="25" r="2.4" /></g>
  <text class="nd lt" x="702" y="327">Take something</text>
  <text class="tx txl" x="678" y="354">Add to cart, on its card or in the</text>
  <text class="tx txl" x="678" y="370">product view. Each Take adds to the</text>
  <text class="tx txl" x="678" y="386">Weight: how much you took from them.</text>

  <!-- 7 -->
  <rect class="night" x="350" y="300" width="260" height="128" rx="12" />
  <circle cx="372" cy="322" r="11" fill="#c8a24c" /><text class="num" x="368" y="326">7</text>
  <g transform="translate(560 306)"><path class="icn" d="M3 30 V13 A12 12 0 0 1 27 13 V30 L22 26 L18 30 L15 26 L12 30 L8 26 Z" /><circle cx="11" cy="14" r="2" fill="#c8a24c" /><circle cx="19" cy="14" r="2" fill="#c8a24c" /></g>
  <text class="nd lt" x="392" y="327">It answers back</text>
  <text class="tx txl" x="368" y="354">A consequence inside the object: the</text>
  <text class="tx txl" x="368" y="370">watch runs backward, the candle's smoke</text>
  <text class="tx txl" x="368" y="386">shows a face, shoes walk to the cart,</text>
  <text class="tx txl" x="368" y="402">the doll's head snaps round…</text>

  <!-- 8 -->
  <rect class="night" x="40" y="300" width="260" height="128" rx="12" />
  <circle cx="62" cy="322" r="11" fill="#c8a24c" /><text class="num" x="58" y="326">8</text>
  <g transform="translate(250 306)"><path class="icn" d="M4 30 C 4 14, 6 2, 15 2 C 24 2, 26 14, 26 30 C 22 27, 19 31, 15 28 C 11 31, 8 27, 4 30 Z" /><circle cx="11" cy="13" r="1.8" fill="#c8a24c" /><circle cx="19" cy="13" r="1.8" fill="#c8a24c" /></g>
  <text class="nd lt" x="82" y="327">Closing time</text>
  <text class="tx txl" x="58" y="354">On the way to checkout the shop</text>
  <text class="tx txl" x="58" y="370">closes: dust sheets fall, eyes open</text>
  <text class="tx txl" x="58" y="386">in the dark, and a white sheet ghost</text>
  <text class="tx txl" x="58" y="402">drifts across and is gone.</text>

  <!-- 4 -> 5 -->
  <path class="ln" d="M1105 224 V298" marker-end="url(#a)" />
  <path class="ln" d="M968 364 H922" marker-end="url(#a)" />
  <path class="ln" d="M658 364 H612" marker-end="url(#a)" />
  <path class="ln" d="M348 364 H302" marker-end="url(#a)" />
  <text class="lb" x="306" y="354">checkout</text>
  <!-- keep shopping loop 7 -> 5 -->
  <path class="ln dash" d="M480 428 C 480 470, 1105 470, 1105 430" marker-end="url(#a)" />
  <text class="lb" x="720" y="466">keep shopping: every product has its own Take</text>

  <!-- ============ Row 3: the end ============ -->
  <!-- 9 -->
  <rect class="night" x="40" y="504" width="260" height="128" rx="12" />
  <circle cx="62" cy="526" r="11" fill="#c8a24c" /><text class="num" x="58" y="530">9</text>
  <g transform="translate(252 510)"><path class="icn" d="M3 2 H25 M3 30 H25 M6 2 C 6 12, 22 14, 22 30 M22 2 C 22 12, 6 14, 6 30" /></g>
  <text class="nd lt" x="82" y="531">Checkout</text>
  <text class="tx txl" x="58" y="558">Pay with time, age or a memory,</text>
  <text class="tx txl" x="58" y="574">tick the agreement (confirmshaming</text>
  <text class="tx txl" x="58" y="590">and a pre-ticked add-on included).</text>

  <!-- 10 -->
  <rect class="end" x="350" y="504" width="260" height="128" rx="12" />
  <circle cx="372" cy="526" r="11" fill="#c8a24c" /><text class="num" x="364" y="530">10</text>
  <g transform="translate(556 512)"><rect class="icn" x="0" y="6" width="22" height="18" rx="3" /><path class="icn" d="M22 11 L32 6 V24 L22 19" /><circle cx="6" cy="2" r="2.6" fill="#c0392b" /></g>
  <text class="nd lt" x="392" y="531">Accept</text>
  <text class="tx txl" x="368" y="558">One tremor, then the only jump scare:</text>
  <text class="tx txl" x="368" y="574">a found-footage frame (REC, grain,</text>
  <text class="tx txl" x="368" y="590">date stamp) and the shop's last</text>
  <text class="tx txl" x="368" y="606">resident at the lens. Never flashes.</text>

  <!-- 11 -->
  <rect class="end" x="660" y="504" width="260" height="128" rx="12" />
  <circle cx="682" cy="526" r="11" fill="#c8a24c" /><text class="num" x="674" y="530">11</text>
  <g transform="translate(882 510)"><path d="M10 2 C 10 2, 2 13, 2 20 A8 8 0 0 0 18 20 C 18 13, 10 2, 10 2 Z" fill="#9b1b24" stroke="#c0392b" stroke-width="1.4" /></g>
  <text class="nd lt" x="702" y="531">The confession</text>
  <text class="tx txl" x="678" y="558">Black. In the middle, large, in blood:</text>
  <text x="678" y="580" style="font: 700 13px Georgia, serif; fill: #c0161c;">"Forgive me, Lord, for I have sinned."</text>
  <text class="tx txl" x="678" y="602">Word by word, each one bleeding a</text>
  <text class="tx txl" x="678" y="618">trail. About 4 s.</text>

  <!-- 12 -->
  <rect class="day" x="970" y="504" width="270" height="128" rx="12" />
  <circle cx="992" cy="526" r="11" fill="#c8a24c" /><text class="num" x="984" y="530">12</text>
  <g transform="translate(1196 508)"><path class="icd" d="M15 1 L18 8 L26 8 L20 13 L22 21 L15 16 L8 21 L10 13 L4 8 L12 8 Z" /><path class="icd" d="M15 22 V31 M10 31 H20" /></g>
  <text class="nd dk" x="1012" y="531">Christmas again</text>
  <text class="tx txd" x="988" y="558">The black lifts off the opening shop.</text>
  <text class="tx txd" x="988" y="574">What you left behind stays. A receipt</text>
  <text class="tx txd" x="988" y="590">lists the dark patterns the shop used</text>
  <text class="tx txd" x="988" y="606">on you, and where.</text>

  <path class="ln" d="M170 428 V502" marker-end="url(#a)" />
  <path class="ln" d="M300 568 H348" marker-end="url(#a)" />
  <path class="lnr" d="M610 568 H658" marker-end="url(#ar)" />
  <path class="lnr" d="M920 568 H968" marker-end="url(#ar)" />

  <!-- ============ Echo ============ -->
  <rect x="40" y="672" width="1200" height="96" rx="12" fill="#141924" stroke="#3a4258" stroke-width="1.2" stroke-dasharray="6 5" />
  <g transform="translate(60 690)"><ellipse class="icn" cx="11" cy="4" rx="11" ry="4" /><path class="icn" d="M0 4 V20 A11 4 0 0 0 22 20 V4" /><path class="icn" d="M0 12 A11 4 0 0 0 22 12" /></g>
  <text class="nd lt" x="96" y="704">The Echo: the next visitor inherits you</text>
  <text class="tx txl" x="96" y="726">At Accept the browser sends POST /api/echo { product, condition } with the one product this player left behind (from fixed allowlists).</text>
  <text class="tx txl" x="96" y="744">When the next visitor's shop opens it reads GET /api/echo and shows what the last player left behind. No names, IPs or identifiers are stored.</text>
  <path class="ln dash" d="M1105 632 V670" marker-end="url(#a)" />
  <path class="ln dash" d="M100 670 C 100 650, 20 640, 20 260 C 20 160, 30 160, 38 160" marker-end="url(#a)" />
  <text class="lb" x="26" y="652">next visitor</text>
</svg>
