name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            api/package-lock.json
      - name: Web
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: API
        working-directory: api
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  deploy:
    name: Deploy to EC2 (SSM)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.EC2_INSTANCE_ID != '' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: short-lived AWS credentials, no stored keys
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run the deploy script on the instance
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          script="https://raw.githubusercontent.com/${REPO}/${SHA}/deploy/remote-deploy.sh"
          params=$(jq -nc --arg s "$script" --arg sha "$SHA" --arg repo "https://github.com/${REPO}.git" \
            '{commands: ["set -euo pipefail", "curl -fsSL \($s) -o /tmp/reclaim-deploy.sh", "bash /tmp/reclaim-deploy.sh \($repo) \($sha)"], executionTimeout: ["1800"]}')
          cmd_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "reclaim ${SHA:0:7}" \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "SSM command: $cmd_id"
          status=Pending
          for i in $(seq 1 180); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text | tail -n 80
          echo "Status: $status"
          test "$status" = Success

      - name: Public health check
        if: vars.SITE_URL != ''
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "${SITE_URL%/}/api/health"; then exit 0; fi
            sleep 5
          done
          echo "Site did not answer at $SITE_URL" >&2
          exit 1
